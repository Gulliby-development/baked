# Locale gate.
#
# Translations arrive here as pull requests from people we have never met, and
# the text they carry is painted into a terminal on somebody else's machine.
# This check runs on every pull request that touches a locale file.
#
# What this workflow is, honestly: friction for honest mistakes and a fast
# signal for contributors. It is NOT the security boundary. A pull request from
# a fork runs the workflow AS MODIFIED BY THAT PULL REQUEST, so a hostile change
# can edit this file to `run: true` and show green. The control that actually
# holds is that every merged locale is re-validated by the maintainer, locally,
# with a copy of the gate this repository cannot touch, before it is embedded
# in any build. Maintainers: a green check here is a reason to look, not a
# reason to skip looking — read the "Files changed" tab, and if a translation
# PR touches anything outside `locales/<tag>.json`, ask why.
name: locales

# The pull_request trigger is NOT path-filtered, on purpose. This check is a
# required status on `main`, and a required check that only runs for some PRs
# blocks every other PR forever ("expected — waiting for status"). The gate
# reads a few JSON files with no install step, so running it on every PR costs
# seconds and lets it be required safely.
on:
  pull_request:
  push:
    paths:
      - "locales/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, not tags. A tag can be moved; a moved
      # tag on a setup action would let someone swap the `bun` that runs the
      # gate for one that always exits 0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      # `en.json` is generated from the application source and published here.
      # It is not something a translation changes. A PR that edits it is either
      # an honest mistake (someone "fixing" the English) or an attempt to add a
      # key so their own file passes the unknown-key check — and in both cases
      # the answer is the same.
      - name: en.json is generated and must not change in a PR
        if: github.event_name == 'pull_request'
        run: |
          # One shallow fetch of the base tip is all the diff needs — no full
          # history clone for a check that reads one file.
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if ! git diff --quiet FETCH_HEAD -- locales/en.json; then
            echo "::error file=locales/en.json::en.json is generated from source and must not be edited here. Open an issue if a source string is wrong."
            exit 1
          fi

      # No install step, deliberately. The gate reads JSON and uses nothing but
      # the standard library, so a translation pull request can never cause a
      # postinstall script to run on CI.
      - name: Validate locale files
        run: bun scripts/validate-locales.ts

      - name: Run the gate's own tests
        run: bun test scripts/validate-locales.test.ts
