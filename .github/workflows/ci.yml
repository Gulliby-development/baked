name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile

      - name: Merge-conflict markers
        run: bun run check:conflicts

      - name: Lint
        run: bunx biome check src/ --reporter=github

      - name: Typecheck
        run: bun run typecheck

      # The OS sandbox integration tests need a working bubblewrap; Ubuntu 24.04 restricts the
      # unprivileged user namespaces it creates unless AppArmor allows them.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Test
        env:
          BAKED_REQUIRE_SANDBOX: bwrap
        run: bun run test

      - name: Build
        run: bun run build

  # Runs on the pull request only; in the merge queue it reports "skipped", which counts as passed.
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - name: Branch name follows AGENTS.md
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bun scripts/check-branch-name.ts "$HEAD_REF"

  # The gate matrix's toolchain tier (#854): every stack's detected gates on a minimal project with
  # the real tools. The runner image has Go, Rust (rustfmt, clippy), Java with Maven and .NET.
  gate-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile

      - name: Python tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest
          pipx install ruff

      - name: Gate matrix with toolchains
        env:
          BAKED_GATE_MATRIX_TOOLCHAINS: "1"
        run: bun test --timeout 900000 tests/gate-matrix.test.ts

  desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
    env:
      # Checks and builds need no Electron binary; packaging jobs download it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome check src/ tests/ scripts/ --reporter=github

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Stages the voice input engine with the pinned Whistle model (checked against its SHA-256)
      # and transcribes silence with it, as packaging does.
      - name: Voice engine
        run: |
          bun run stage:voice
          bun scripts/voice-check.ts

      - name: Build
        run: bun run build

      # Playwright drives the built renderer in the runner's Google Chrome; no browser download.
      - name: UI tests
        run: bun run e2e

      # The built app against a fake baked (tests/fixtures/fake-serve.ts) and, for chat, the real
      # baked serve with a scripted model (BAKED_TEST_SCRIPT), under xvfb.
      - name: Electron UI tests
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
        run: |
          node node_modules/electron/install.js
          # The chat scenario runs the repository's own baked serve from source.
          (cd ../.. && bun install --frozen-lockfile)
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a bunx playwright test -c playwright.electron.config.ts

      - name: Upload UI test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-ui-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7
