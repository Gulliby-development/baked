name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# A newer push to the same pull request cancels this run, so superseded runs free their runners:
# the account runs a limited number of jobs at once, and on 2026-11-04 Linux jobs waited for one (#2915).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The suite in five shards balanced by measured time (scripts/test-shard.ts, the macOS column of
  # scripts/test-shard-weights.json). One `bun run test` ran 35 to 37 minutes by 2026-11-03, most of it
  # the replay corpus, which grows with every bench round's traces; each merge queue entry waited that
  # long, and five entries at a time held the queue for hours.
  test:
    runs-on: ubuntu-latest
    name: test (${{ matrix.shard }}/5)
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile

      # The OS sandbox integration tests need a working bubblewrap; Ubuntu 24.04 restricts the
      # unprivileged user namespaces it creates unless AppArmor allows them.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The shard runs `bun test --timeout 30000` on its files and then the slow-test report (#1656).
      # Every 20 s (#2919), record the runner's load, memory, CPU and I/O pressure, and its busiest processes.
      # On 2026-11-04 two shards ran gofmt, cargo and mvn for minutes while other runners took
      # seconds; a failed shard prints the record, which tells a busy leftover process from a stalled disk.
      - name: Record runner load
        run: |
          nohup bash -c 'while true; do { date -u +%T; cat /proc/loadavg; free -m | sed -n 2p; cat /proc/pressure/cpu /proc/pressure/io 2>/dev/null; ps -eo pid,pcpu,pmem,etimes,stat,comm --sort=-pcpu | head -6; } >> "$RUNNER_TEMP/runner-load.log" 2>&1; sleep 20; done' > /dev/null 2>&1 &
      - name: Test
        env:
          BAKED_REQUIRE_SANDBOX: bwrap
        run: bun scripts/test-shard.ts ${{ matrix.shard }} 5
      - name: Runner load during the tests
        if: failure()
        run: cat "$RUNNER_TEMP/runner-load.log"

  # The required check: lint, typecheck and build, and it fails unless every test shard passed. It
  # runs after the shards, so a failed or cancelled shard can never leave it skipped (a skipped
  # required check counts as passed).
  check:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Test shards
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "Test shards: $RESULT"
          [ "$RESULT" = "success" ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile

      - name: Merge-conflict markers
        run: bun run check:conflicts

      - name: Lint
        run: bunx biome check src/ --reporter=github

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  # Runs on the pull request only; in the merge queue it reports "skipped", which counts as passed.
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - name: Branch name follows AGENTS.md
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bun scripts/check-branch-name.ts "$HEAD_REF"

  # The gate matrix's toolchain tier (#854): every stack's detected gates on a minimal project with
  # the real tools. The runner image has Go, Rust (rustfmt, clippy), Java with Maven, .NET and CMake;
  # the Python tools step adds pytest, ruff and SQLFluff.
  gate-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile

      - name: Python tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest
          pipx install ruff
          pipx install sqlfluff==4.4.0

      - name: C and C++ tools
        run: sudo apt-get install -y libgtest-dev clang-format clang-tidy
      # ubuntu-latest ships pwsh; the modules go to the AllUsers scope, since the gate matrix
      # isolates HOME and a CurrentUser module would not load (#1498).
      - name: PowerShell modules
        shell: bash
        run: sudo pwsh -NoProfile -NonInteractive -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module Pester -RequiredVersion 5.9.1 -Scope AllUsers -Force -SkipPublisherCheck; Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope AllUsers -Force"

      # R from Ubuntu's packages. Ubuntu has no styler, which is pure R: its dependencies come from
      # apt and styler itself from CRAN, into the site library, since the gate matrix isolates HOME
      # (#1500).
      - name: R packages
        run: |
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-testthat r-cran-lintr \
            r-cran-pkgload r-cran-r.cache r-cran-purrr r-cran-rematch2 r-cran-tibble r-cran-withr \
            r-cran-xfun r-cran-backports r-cran-rprojroot r-cran-magrittr r-cran-cli r-cran-rlang
          sudo Rscript -e 'install.packages("styler", repos = "https://cloud.r-project.org", lib = .Library.site[1], dependencies = FALSE)'

      - name: Gate matrix with toolchains
        env:
          BAKED_GATE_MATRIX_TOOLCHAINS: "1"
        run: bun test --timeout 900000 tests/gate-matrix.test.ts

  desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
    env:
      # Checks and builds need no Electron binary; packaging jobs download it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome check src/ tests/ scripts/ --reporter=github

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Stages the voice input engine with the pinned Whistle model (checked against its SHA-256)
      # and transcribes silence with it, as packaging does.
      - name: Voice engine
        run: |
          bun run stage:voice
          bun scripts/voice-check.ts

      - name: Build
        run: bun run build

      # Playwright drives the built renderer in the runner's Google Chrome; no browser download.
      - name: UI tests
        run: bun run e2e

      # The built app against a fake baked (tests/fixtures/fake-serve.ts) and, for chat, the real
      # baked serve with a scripted model (BAKED_TEST_SCRIPT), under xvfb.
      - name: Electron UI tests
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
        run: |
          node node_modules/electron/install.js
          # The chat scenario runs the repository's own baked serve from source.
          (cd ../.. && bun install --frozen-lockfile)
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a bunx playwright test -c playwright.electron.config.ts

      - name: Upload UI test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-ui-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7
