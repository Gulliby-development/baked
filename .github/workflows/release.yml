name: Release

# Runs when a version tag is pushed (`scripts/release.sh` creates it). It checks
# that the tag matches package.json, runs the full check suite, builds every
# distributable through the Builds workflow, and publishes a GitHub release with
# the archives, the desktop installers, their SHA-256 checksums and notes
# generated from merged pull requests (categories in .github/release.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(bun -e "console.log(require('./package.json').version)")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bunx biome check src/ --reporter=github
      - run: bun run typecheck
      - run: bun scripts/validate-locales.ts
      - run: bun test

  builds:
    needs: verify
    uses: ./.github/workflows/builds.yml
    with:
      release: true

  publish:
    needs: builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      # An artifact with files from several directories (release-windows) keeps
      # those directories, so collect every file into one flat folder.
      - name: Checksums
        run: |
          mkdir release
          find assets -type f -exec mv -n -t release {} +
          if [ -n "$(find assets -type f)" ]; then
            echo "::error::Two release files share a name"
            exit 1
          fi
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "BAKED ${TAG#v}" \
            --generate-notes
