name: Scheduled release

# Cuts a minor release every second day (0.5.0 -> 0.6.0 -> 0.7.0) without a laptop step.
# The daily cron asks scripts/scheduled-release.ts whether the latest v* tag is at least
# 44 hours old and main has commits it does not contain; if so it commits the version bump
# on top of main outside any branch, tags that commit vX.Y.Z and starts release.yml on the
# tag. main itself is not changed, so the merge queue is not involved. A tag pushed with
# GITHUB_TOKEN does not trigger `push` workflows, hence the explicit dispatch.
# Run it by hand ("Run workflow") to release now: `force` skips the two-day wait.

on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [minor, patch, major]
        default: minor
      force:
        description: Release even if the last release is under two days old
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.repository == 'Gulliby-development/baked'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
          no-cache: true

      - name: Plan
        id: plan
        env:
          BUMP: ${{ inputs.bump || 'minor' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          BASE: HEAD
        run: bun scripts/scheduled-release.ts plan

      - name: Tag and start the release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun scripts/scheduled-release.ts stamp "$VERSION"
          git commit -am "Release $VERSION"
          git tag -a "$TAG" -m "BAKED $VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Tagged $TAG on top of $(git rev-parse --short HEAD~1) and started the Release workflow." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: steps.plan.outputs.release != 'true'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          echo "No release today: $REASON" >> "$GITHUB_STEP_SUMMARY"
