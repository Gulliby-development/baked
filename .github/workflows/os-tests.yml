name: OS tests

# Runs `bun run test` on Windows and macOS; `CI / check` runs it on Linux for every pull request.
# Windows and macOS runners cost 2x and 10x Linux minutes in a private repository, so these run
# in the merge queue for changes to platform-sensitive code (process, path, shell, filesystem and
# key store handling, the workflow runtime, the test setup), nightly against main, and on demand.
# On a pull request the `test (...)` checks pass at once: the queue tests the same change merged
# with the current main before it lands. Windows is the slow platform, so its run is split into
# shards that run side by side; `test (<os>)` reports the result of all of its shards. Files go to
# shards by their measured time on that OS (scripts/test-shard-weights.json).

on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # A pull request that changes how these tests run still runs them, to prove the change.
          if [ "$EVENT" = "pull_request" ] && ! git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(\.github/workflows/os-tests\.yml|scripts/(test-shard(-weights)?|flaky-ledger)\.ts|scripts/test-shard-weights\.json)$'; then
            echo "Pull request: these platforms run in the merge queue."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "merge_group" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "$changed"
          pattern='^(package\.json$|bun\.lock$|bunfig\.toml$|tsconfig\.json$|\.gitattributes$|\.github/workflows/os-tests\.yml$|scripts/(test-shard(-weights)?|flaky-ledger)\.ts$|scripts/test-shard-weights\.json$|tests/setup/|src/core/(platform|workflows|verification|tools|sessions|memory|hooks|security|utils|workers|git|checkpoints|mcp|terminal|projects)/|src/core/(spawn|process-tracker|secrets|cwd)\.ts$|src/headless/)'
          if echo "$changed" | grep -Eq "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  shard:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each shard must finish inside the job's 30 minutes. Files used to go round-robin by name:
          # on 2026-10-26 one Windows shard of three passed 30 minutes while another took 10, and a
          # single macOS shard passed it too (#2259, #2261). They are now balanced by measured time
          # (scripts/test-shard-weights.json). On 2026-10-28 the replay corpus, one file of 15 to 30
          # minutes, filled macOS shard 1 alone and passed 30 minutes twice; it is now four files.
          - { os: windows-latest, shard: 1, shards: 5 }
          - { os: windows-latest, shard: 2, shards: 5 }
          - { os: windows-latest, shard: 3, shards: 5 }
          - { os: windows-latest, shard: 4, shards: 5 }
          - { os: windows-latest, shard: 5, shards: 5 }
          - { os: macos-latest, shard: 1, shards: 3 }
          - { os: macos-latest, shard: 2, shards: 3 }
          - { os: macos-latest, shard: 3, shards: 3 }
    runs-on: ${{ matrix.os }}
    name: shard (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    timeout-minutes: 30
    steps:
      - name: Skip
        if: needs.scope.outputs.run != 'true'
        run: echo "No platform-sensitive files changed, or this is a pull request; this platform runs in the merge queue and nightly."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.scope.outputs.run == 'true'
        with:
          bun-version: "1.4.3"
      - name: Install
        if: needs.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      # The tests put every repository, database and scratch file in the system temp directory. On
      # a Windows runner that is on C:, the OS disk, where a test of file and git work took 42 s in
      # one job and 2 s in another running the same commit at the same time (#1910). D: holds the
      # checkout and RUNNER_TEMP. The runner user is an administrator whose files on D: are owned
      # by the Administrators group, which the OS sandbox makes deny-only; the user's own ACE, as
      # in its profile's temp directory, keeps those files writable for a sandboxed command.
      - name: Keep temp files on the work disk
        if: needs.scope.outputs.run == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "tmp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          icacls $temp /grant "${env:USERNAME}:(OI)(CI)F" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - name: Test
        if: needs.scope.outputs.run == 'true'
        env:
          # macOS ships sandbox-exec and Windows runs BAKED's restricted-token launcher, so the OS
          # sandbox integration tests must run on both.
          BAKED_REQUIRE_SANDBOX: ${{ matrix.os == 'macos-latest' && 'seatbelt' || 'restricted-token' }}
          # A test above 80 percent of its time limit fails the nightly run against main; in the merge
          # queue it is only an annotation, so it does not eject a pull request before it times out.
          SLOW_TESTS_FAIL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
          # A failed shard reruns each failed test alone and writes whether it is likely flaky.
          FLAKY_LEDGER: ${{ runner.temp }}/flaky-ledger.json
        run: bun scripts/test-shard.ts ${{ matrix.shard }} ${{ matrix.shards }}
      - name: Upload the flaky test ledger
        if: failure() && needs.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flaky-ledger-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/flaky-ledger.json
          if-no-files-found: ignore
          retention-days: 90

  # The required checks: one per platform, green only when every shard of it passed.
  test:
    needs: shard
    if: always()
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ubuntu-latest
    name: test (${{ matrix.os }})
    steps:
      - name: All shards passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "Shards: $RESULT"
          [ "$RESULT" = "success" ]
