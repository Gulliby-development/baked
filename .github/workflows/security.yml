name: Security

# Keyless scanners over the workflows, the commits and the lockfiles (#1844). Report only for
# now: the jobs are not required checks until they have run two weeks without false positives.
# Every tool is pinned: zizmor by wheel hash, gitleaks and osv-scanner by module version, which
# `go install` verifies against the Go checksum database. A failed download fails the job.

on:
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --no-deps --only-binary :all: --require-hashes -r .github/security/zizmor-requirements.txt
      - name: Audit workflows and actions
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --offline --config .github/zizmor.yml --format github .'

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: auto
      GOBIN: ${{ runner.temp }}/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: '"$GOBIN/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$BASE..$HEAD" .'

  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: auto
      GOBIN: ${{ runner.temp }}/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
      # Exit 1 means known vulnerabilities; 127 (an error, such as the OSV API out of reach) and
      # 128 (no packages read) fail too, so a scan that did not run is never green.
      - name: Scan the lockfiles
        run: '"$GOBIN/osv-scanner" scan source --lockfile bun.lock --lockfile apps/desktop/bun.lock'
