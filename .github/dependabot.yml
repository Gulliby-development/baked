version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # A release must be a week old before it is proposed (zizmor dependabot-cooldown, #1844).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # web-tree-sitter stays at 0.25.10 for @opentui/core; code intelligence uses the web-tree-sitter-engine alias.
      - dependency-name: web-tree-sitter
        versions: [">=0.26.0"]
  - package-ecosystem: bun
    directory: /apps/desktop
    schedule:
      interval: weekly
    # A release must be a week old before it is proposed (zizmor dependabot-cooldown, #1844).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release must be a week old before it is proposed (zizmor dependabot-cooldown, #1844).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
